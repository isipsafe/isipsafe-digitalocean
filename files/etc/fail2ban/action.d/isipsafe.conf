# Report banned addresses to isIPsafe (https://isipsafe.com).
# Needs an API key in /etc/isipsafe/env; without one the action does nothing.
#
# Usage in a jail:
#   action = %(action_)s
#            isipsafe[categories="ssh,brute-force"]

[Definition]

norestored = 1

actionstart =

actionstop =

actioncheck =

actionban = /opt/isipsafe/bin/isipsafe-fail2ban-report "<ip>" "<categories>" "<name>" "<failures>"

actionunban =

[Init]

categories = brute-force

timeout = 45
